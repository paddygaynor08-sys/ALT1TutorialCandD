
<!DOCTYPE html>
<html>
<head>
  <title>Homework Diary</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="/client.js" defer></script>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header>
    <h1>Homework Diary</h1>
    <p>Keep track of your subjects, homework and deadlines.</p>
  </header>

  <main class="page-layout">

    <section class="form-panel">
      <h2>Add New Homework</h2>
      <p>Enter your homework details below.</p>

      <form id="homework-form">

        <div class="form-group">
          <label for="subject">Subject:</label>
          <input id="subject" type="text"
            placeholder="e.g. Maths" required>
        </div>

        <div class="form-group">
          <label for="details">Details:</label>
          <input id="details" type="text"
            placeholder="e.g. Complete questions 1-5" required>
        </div>

        <div class="form-group">
          <label for="dueDate">Due Date:</label>
          <input id="dueDate" type="date" required>
        </div>

        <button id="submit-btn" type="submit">
          Add Homework
        </button>

        <p id="message" aria-live="polite"></p>

      </form>
    </section>

    <section class="homework-panel">
      <h2>Your Homework</h2>
      <p>All your saved homework will appear here.</p>

      <ul id="users"></ul>
    </section>

  </main>

  <footer>
    <p>Homework Diary | Stay organised and meet your deadlines.</p>
  </footer>

</body>
</html>
